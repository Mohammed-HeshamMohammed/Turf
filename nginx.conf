# A template: the image fills in ${AUTH_ORIGIN}, ${API_ORIGIN}, ${LANDING_API_ORIGIN} and ${GRAFANA_ORIGIN} from its environment when it starts
# (Dockerfile sets defaults; Coolify can override them).
map $request_uri $callerwhale_request_path { ~^([^?]*) $1; }
map $callerwhale_request_path $callerwhale_page {
  default "Page or file            ";
  / "Home page               ";
  /features "Features page           ";
  /features/ "Features page           ";
  /pricing "Pricing page            ";
  /pricing/ "Pricing page            ";
  /compare "Why Caller Whale page   ";
  /compare/ "Why Caller Whale page   ";
  /security "Security page           ";
  /security/ "Security page           ";
  /contact "Contact page            ";
  /contact/ "Contact page            ";
  /privacy "Privacy page            ";
  /privacy/ "Privacy page            ";
  /terms "Terms page              ";
  /terms/ "Terms page              ";
  /signin "Sign in page            ";
  /signin/ "Sign in page            ";
  /signup "Create account page     ";
  /signup/ "Create account page     ";
  /dashboard "Dashboard page          ";
  /dashboard/ "Dashboard page          ";
  /verify "Email confirmation page ";
  /desktop-sign-in "Desktop sign-in page    ";
  /desktop-sign-in/ "Desktop sign-in page    ";
  /verify/ "Email confirmation page ";
  /robots.txt "Search crawler rules    ";
  /sitemap.xml "Sitemap                 ";
  /manifest.json "App manifest            ";
  /favicon.ico "Site icon               ";
  ~^/assets/ "Website asset           ";
}
map $status $callerwhale_result {
  default "[REVIEW]  ";
  ~^2 "[OK]      ";
  ~^3 "[REDIRECT]";
  ~^4 "[REJECTED]";
  ~^5 "[ERROR]   ";
}
map $request_method $callerwhale_method {
  default "OTHER  ";
  GET "GET    ";
  HEAD "HEAD   ";
  POST "POST   ";
  PUT "PUT    ";
  PATCH "PATCH  ";
  DELETE "DELETE ";
  OPTIONS "OPTIONS";
  CONNECT "CONNECT";
  TRACE "TRACE  ";
}
map $request_time $callerwhale_time {
  default "  >99999 s ";
  "~^(?<cw_time_1>[0-9]{1}[.][0-9]{3})$" "    $cw_time_1 s";
  "~^(?<cw_time_2>[0-9]{2}[.][0-9]{3})$" "   $cw_time_2 s";
  "~^(?<cw_time_3>[0-9]{3}[.][0-9]{3})$" "  $cw_time_3 s";
  "~^(?<cw_time_4>[0-9]{4}[.][0-9]{3})$" " $cw_time_4 s";
  "~^(?<cw_time_5>[0-9]{5}[.][0-9]{3})$" "$cw_time_5 s";
}
log_format callerwhale_website escape=json '| $callerwhale_result | Website   | $callerwhale_page | $callerwhale_method | $status  | $callerwhale_time | $callerwhale_request_path';
server {
  listen 8080;
  access_log /dev/stdout callerwhale_website;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  # Any redirect nginx still makes is relative, so behind Coolify's proxy it keeps the public address instead of
  # naming this container's own port (8080), which nobody outside can reach.
  absolute_redirect off;
  error_page 404 /404.html;

  # The site's scripts come only from itself; it talks to itself, to Caller Whale's server and to the auth service, and
  # frames nothing but the admin mode's Grafana. Styles allow the inline style attributes of the prerendered pages.
  set $csp "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; connect-src 'self' https://www.google.com/recaptcha/ ${API_ORIGIN} ${LANDING_API_ORIGIN} ${AUTH_ORIGIN}; frame-src 'self' ${GRAFANA_ORIGIN} https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self' ${GRAFANA_ORIGIN}; frame-ancestors 'none'";

  location = /healthz { access_log off; default_type application/json; return 200 '{"ok":true}'; }

  # nginx drops the headers set outside a location as soon as the location sets one of its own, so the security
  # headers are repeated in each location that sets a header.
  # Built files carry a hash in their name: cache them for good. The page itself is always asked for again.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Every page is prerendered as <page>/index.html: "/pricing" is served as it is, with no redirect, matching the
    # site's links, canonical links and sitemap. Anything else is a real 404 with the site's 404 page.
    try_files $uri $uri/index.html =404;
  }
}
