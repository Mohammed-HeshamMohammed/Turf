[package]
name = "turf"
version = "0.1.0"
description = "Turf: manage your lists and the areas they cover"
edition = "2021"

[lib]
name = "turf_lib"
# Only what the desktop app needs. The static and dynamic library forms are for phone builds, which Turf does not have;
# on a desktop build they only cost about a gigabyte of disk and extra time on every change.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
# Fetches pieces of the street map for the on-disk cache (mapcache.rs).
ureq = "2"
