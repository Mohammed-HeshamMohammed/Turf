[project]
name = "callerwhale-worker"
version = "0.1.0"
description = "Caller Whale's Python worker: imports, Skip Tracing jobs, reports, and the legacy project import"
requires-python = ">=3.11"
# The phone and status rules come from the desktop service (service/callerwhale_matching), shared, not copied.
dependencies = ["phonenumbers>=8.13", "rapidfuzz>=3.0"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
callerwhale-worker = "callerwhale_worker.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
