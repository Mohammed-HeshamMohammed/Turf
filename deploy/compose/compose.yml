# Every service on one machine (decision 1 of docs/plans/service-architecture.md). Only the gateway is published.
# From the repository root:  docker compose --env-file env/compose.env -f deploy/compose/compose.yml up --build
# The scaffolds (scaffolds/, D384) are never built here.
# The secrets come from env/compose.env (node tools/env-init.mjs creates it; env/README.md).
name: callerwhale
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env/compose.env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    environment:
      PORT: "8100"
      UPSTREAMS: "auth=http://auth:8101,notifications=http://notifications:8102,billing=http://billing:8103,importing-lists=http://importing-lists:8111,dialer-sms=http://dialer-sms:8113,messaging=http://messaging:8108"
    ports:
      - "8100:8100"
    restart: unless-stopped
  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: "8101"
      DATABASE_URL: "${AUTH_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_auth}"
      # Without it every token stops working on restart.
      AUTH_SIGNING_KEY: "${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in env/compose.env}"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_AUTH_TOKEN:?set AUTHZ_AUTH_TOKEN in env/compose.env}"
    restart: unless-stopped
  notifications:
    build:
      context: ../..
      dockerfile: services/notifications/Dockerfile
    environment:
      PORT: "8102"
    restart: unless-stopped
  billing:
    build:
      context: ../..
      dockerfile: services/billing/Dockerfile
    environment:
      PORT: "8103"
      DATABASE_URL: "${BILLING_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_billing}"
      BILLING_TOKENS: "${BILLING_TOKENS:-}"
      PADDLE_WEBHOOK_SECRET: "${PADDLE_WEBHOOK_SECRET:-}"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_BILLING_TOKEN:?set AUTHZ_BILLING_TOKEN in env/compose.env}"
    restart: unless-stopped
  authz:
    build:
      context: ../..
      dockerfile: services/authz/Dockerfile
    environment:
      PORT: "8104"
      DATABASE_URL: "${AUTHZ_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_authz?sslmode=disable}"
      AUTHZ_SIGNING_KEY: "${AUTHZ_SIGNING_KEY:?set AUTHZ_SIGNING_KEY in env/compose.env}"
      AUTHZ_TOKENS: "billing=${AUTHZ_BILLING_TOKEN:?set AUTHZ_BILLING_TOKEN in env/compose.env},auth=${AUTHZ_AUTH_TOKEN:?set AUTHZ_AUTH_TOKEN in env/compose.env},core-api=${AUTHZ_CORE_TOKEN:?set AUTHZ_CORE_TOKEN in env/compose.env}"
    depends_on:
      - postgres
    restart: unless-stopped
  crm-core:
    build:
      context: ../..
      dockerfile: services/crm-core/Dockerfile
    environment:
      PORT: "8107"
      DATABASE_URL: "${CRM_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_crm?sslmode=disable}"
      AUTH_JWKS_URL: "http://auth:8101/.well-known/jwks.json"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_CORE_TOKEN:?set AUTHZ_CORE_TOKEN in env/compose.env}"
      NOTIFY_URL: "http://notifications:8102"
      IMPORT_DIR: "/data/imports"
      # The job queue is worked by crm-merge and crm-outbox below (split 2).
      CRM_RUN_JOBS: "false"
    volumes:
      - imports:/data/imports
    depends_on:
      - postgres
      - authz
    restart: unless-stopped
  # Split 2: crm-core's job containers, the same code with only their queues switched on. They wait for crm-core's database update.
  crm-merge:
    build:
      context: ../..
      dockerfile: services/crm-core/Dockerfile.merge
    environment:
      PORT: "8120"
      DATABASE_URL: "${CRM_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_crm?sslmode=disable}"
    depends_on:
      - crm-core
    restart: unless-stopped
  crm-outbox:
    build:
      context: ../..
      dockerfile: services/crm-core/Dockerfile.outbox
    environment:
      PORT: "8121"
      DATABASE_URL: "${CRM_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_crm?sslmode=disable}"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_CORE_TOKEN:?set AUTHZ_CORE_TOKEN in env/compose.env}"
    depends_on:
      - crm-core
    restart: unless-stopped
  messaging:
    build:
      context: ../..
      dockerfile: services/messaging/Dockerfile
    environment:
      PORT: "8108"
      DATABASE_URL: "${MESSAGING_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_messaging?sslmode=disable}"
      AUTH_JWKS_URL: "http://auth:8101/.well-known/jwks.json"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_MESSAGING_TOKEN:?set AUTHZ_MESSAGING_TOKEN in env/compose.env (and messaging=... in authz's AUTHZ_TOKENS)}"
      LIVE_DB_PASSWORD: "${LIVE_DB_PASSWORD:?set LIVE_DB_PASSWORD in env/compose.env (32+ characters, no quotes)}"
      LIVE_TOKEN_SECRET: "${LIVE_TOKEN_SECRET:?set LIVE_TOKEN_SECRET in env/compose.env}"
      LIVE_PUBLIC_URL: "${LIVE_PUBLIC_URL:-ws://localhost:8000/connection/websocket}"
    depends_on:
      - postgres
      - authz
      - centrifugo
    restart: unless-stopped
  # The live server: holds the apps' sockets and reads the messaging outbox itself, as the read-only login messaging makes.
  centrifugo:
    build:
      context: ../..
      dockerfile: services/live/Dockerfile
    environment:
      CENTRIFUGO_HTTP_API_KEY: "${LIVE_API_KEY:?set LIVE_API_KEY in env/compose.env}"
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${LIVE_TOKEN_SECRET:?set LIVE_TOKEN_SECRET in env/compose.env}"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${LIVE_ALLOWED_ORIGINS:-http://localhost:5190}"
      CENTRIFUGO_CONSUMERS_MESSAGING_ENABLED: "true"
      CENTRIFUGO_CONSUMERS_MESSAGING_POSTGRESQL_DSN: "postgres://messaging_live:${LIVE_DB_PASSWORD}@postgres:5432/callerwhale_messaging?sslmode=disable"
    ports:
      - "8000:8000"
    restart: unless-stopped
  assistant:
    build:
      context: ../..
      dockerfile: services/assistant/Dockerfile
    environment:
      PORT: "8109"
      CORS_ORIGINS: "${SITE_ORIGIN:-http://localhost:5200}"
      # Empty runs the script only; set it in env/compose.env to try the AI.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    restart: unless-stopped
  importing-lists:
    build:
      context: ../..
      dockerfile: services/importing-lists/Dockerfile
    environment:
      PORT: "8111"
      # One machine for trying things out: the database owner. Production gives it its own login (IMPORT_DB_ROLE on crm-core).
      DATABASE_URL: "${CRM_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_crm?sslmode=disable}"
      IMPORT_DIR: "/data/imports"
      # Shared with importing-worker, which fetches each finished upload from here.
      IMPORT_FILE_TOKEN: "${IMPORT_FILE_TOKEN:-local-import-file-token}"
    volumes:
      - imports:/data/imports
    depends_on:
      - crm-core
    restart: unless-stopped
  importing-worker:
    build:
      context: ../..
      dockerfile: services/importing-worker/Dockerfile
    environment:
      PORT: "8119"
      DATABASE_URL: "${CRM_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_crm?sslmode=disable}"
      IMPORT_DIR: "/data/imports"
      IMPORT_API_URL: "http://importing-lists:8111"
      IMPORT_FILE_TOKEN: "${IMPORT_FILE_TOKEN:-local-import-file-token}"
    # Its own volume, not the upload service's.
    volumes:
      - import-work:/data/imports
    # No memory or CPU cap: a large list may use what the machine has.
    restart: unless-stopped
  dialer-sms:
    build:
      context: ../..
      dockerfile: services/dialer-sms/Dockerfile
    environment:
      PORT: "8113"
    restart: unless-stopped
volumes:
  postgres-data:
  imports:
  import-work:
