openapi: 3.0.3
info:
  title: Turf Dialer, auto dialing and SMS
  version: 0.1.0
  description: Feature 3: calling, auto dialing, texting, number health, call logs and the carrier webhooks.
paths:
  /healthz:
    get:
      summary: Is the service running
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string, example: dialer-sms }
  /version:
    get:
      summary: The running version
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [service, version]
                properties:
                  service: { type: string }
                  version: { type: string, example: 0.1.0 }
