[package]
name = "turf-api"
description = "Turf CRM API: authentication, permissions, CRM transactions, synchronization and events"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros", "rust_decimal"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
tower-layer = "0.3"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "request-id", "propagate-header", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
turf-auth-verify = { path = "../../../../auth/verify" }
turf-grouping = { path = "../grouping" }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies"] }
ring = "0.17"
tokio-tungstenite = "0.29"
futures-util = "0.3"
