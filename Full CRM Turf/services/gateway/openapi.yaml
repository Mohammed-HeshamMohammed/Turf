openapi: 3.0.3
info:
  title: Caller Whale Gateway
  version: 0.1.0
  description: The one public entry point: HTTPS, token check, rate limits, and routing of /api/v1/<service>/* to the service behind it.
paths:
  /healthz:
    get:
      summary: Is the service running
      responses:
        "200":
          description: Running
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string, example: gateway }
  /version:
    get:
      summary: The running version
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required: [service, version]
                properties:
                  service: { type: string }
                  version: { type: string, example: 0.1.0 }
