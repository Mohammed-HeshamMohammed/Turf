# A template: the image fills in ${FIREBASE_AUTH_HOST} and ${API_ORIGIN} from its environment when it starts
# (Dockerfile sets defaults; Coolify can override them).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  # Any redirect nginx still makes is relative, so behind Coolify's proxy it keeps the public address instead of
  # naming this container's own port (8080), which nobody outside can reach.
  absolute_redirect off;
  error_page 404 /404.html;

  # One public address: www.callerwhale.com goes to callerwhale.com (the same path), so links, canonical addresses and the
  # sitemap all agree. Health checks and the certificate challenge come in on the container's own name and are not touched.
  if ($host = www.callerwhale.com) {
    return 301 https://callerwhale.com$request_uri;
  }

  # The site's scripts come only from itself (and Google's sign-in script); it talks to itself, Turf's server and
  # Firebase's two sign-in APIs, and frames nothing but Firebase's sign-in helper, served from this same address.
  # Styles allow the inline style attributes of the prerendered pages.
  set $csp "default-src 'self'; script-src 'self' https://apis.google.com; connect-src 'self' ${API_ORIGIN} https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://${FIREBASE_AUTH_HOST}; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self' ${GRAFANA_ORIGIN}; frame-ancestors 'none'";

  location = /healthz { access_log off; default_type application/json; return 200 '{"ok":true}'; }

  # Firebase's sign-in helper (Google's redirect comes back to /__/auth/handler), served from this site's own address,
  # so the sign-in works in browsers that block other sites' storage. The page's authDomain is this site's domain.
  location /__/auth/ {
    proxy_pass https://${FIREBASE_AUTH_HOST};
    proxy_ssl_server_name on;
    proxy_set_header Host ${FIREBASE_AUTH_HOST};
    proxy_set_header Cookie "";
  }
  location /__/firebase/ {
    proxy_pass https://${FIREBASE_AUTH_HOST};
    proxy_ssl_server_name on;
    proxy_set_header Host ${FIREBASE_AUTH_HOST};
    proxy_set_header Cookie "";
  }

  # nginx drops the headers set outside a location as soon as the location sets one of its own, so the security
  # headers are repeated in each location that sets a header.
  # Built files carry a hash in their name: cache them for good. The page itself is always asked for again.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri =404;
  }
  # The staff pages: kept out of search engines, and (with no mention in the sitemap, robots.txt or the page's title)
  # nothing for a search bar to suggest.
  location ^~ /admin {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri $uri/index.html =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Every page is prerendered as <page>/index.html: "/pricing" is served as it is, with no redirect, matching the
    # site's links, canonical links and sitemap. Anything else is a real 404 with the site's 404 page.
    try_files $uri $uri/index.html =404;
  }
}
