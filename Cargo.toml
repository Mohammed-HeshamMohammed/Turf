# The Rust workspace (D383, step 52): the desktop app's window (Tauri, apps/crm-desktop) and its feature crates
# (crates/desktop-features). One lock file and one `cargo test --workspace`. The scaffold crates (D384) keep their own small
# workspace in scaffolds/.
[workspace]
resolver = "2"
members = [
  "apps/crm-desktop",
  "crates/desktop-features/importing-lists",
  "crates/desktop-features/skip-tracing",
  "crates/desktop-features/dialer-sms",
  "crates/desktop-features/leads-map",
  "crates/desktop-features/crm",
  "crates/desktop-features/ai-campaigns",
  "crates/desktop-features/exports",
  "crates/desktop-features/backup-restore",
]
# Rust projects under this folder that have their own workspace or none: without this, cargo takes them for members.
exclude = ["apps/lists-desktop/src-tauri"]

# A workspace sets profiles at its root. Dependencies are compiled once and rarely change, so keep them fast while the crates'
# own code builds quickly (was in the window's Cargo.toml).
[profile.dev.package."*"]
opt-level = 2
