[package]
name = "callerwhale-auth-verify"
version = "0.1.0"
edition = "2021"
description = "Checks a Caller Whale access token against the auth service's public keys. Every Rust service uses this; none of them call auth to do it."
publish = false

[dependencies]
jsonwebtoken = "10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
ring = "0.17"
base64 = "0.22"
