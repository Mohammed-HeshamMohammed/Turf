# SpiceDB, the authorization service's rules store (docs/plans/authorization-service.md). One Coolify resource of type Docker
# Compose, from the spicedb-production branch. No domain and no published port: only the authorization service (authz) calls
# it, on the shared Coolify network, with the preshared key. authz writes the rules' schema itself when it starts.
#
# Locally (from the repository folder "Caller Whale CRM"):
#   docker compose --env-file deploy/spicedb/.env -f deploy/spicedb/compose.yml up
name: callerwhale-spicedb
services:
  # Brings SpiceDB's own tables up to date, then exits. SpiceDB starts only after it succeeded.
  migrate:
    image: authzed/spicedb:v1.57.0
    command: ["datastore", "migrate", "head"]
    environment:
      # SpiceDB's datastore: postgres. Fixed in the compose file.
      SPICEDB_DATASTORE_ENGINE: postgres
      # Secret PostgreSQL URI of SpiceDB's own database and login (callerwhale_spicedb). No other service uses it.
      SPICEDB_DATASTORE_CONN_URI: "${SPICEDB_DATASTORE_CONN_URI:?set SPICEDB_DATASTORE_CONN_URI, SpiceDB's own database}"
    networks:
      - coolify
    restart: "no"

  spicedb:
    image: authzed/spicedb:v1.57.0
    command: ["serve"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Secret key authz sends with every call (authz's SPICEDB_PRESHARED_KEY). Long and random; change both together.
      SPICEDB_GRPC_PRESHARED_KEY: "${SPICEDB_GRPC_PRESHARED_KEY:?set SPICEDB_GRPC_PRESHARED_KEY, the key authz sends}"
      # SpiceDB's datastore: postgres. Fixed in the compose file.
      SPICEDB_DATASTORE_ENGINE: postgres
      # Secret PostgreSQL URI of SpiceDB's own database and login (callerwhale_spicedb). No other service uses it.
      SPICEDB_DATASTORE_CONN_URI: "${SPICEDB_DATASTORE_CONN_URI:?set SPICEDB_DATASTORE_CONN_URI, SpiceDB's own database}"
      # false: only the private gRPC API, with no HTTP gateway or dashboard.
      SPICEDB_HTTP_ENABLED: "false"
      # Empty: no usage reports leave the server.
      SPICEDB_TELEMETRY_ENDPOINT: ""
    networks:
      coolify:
        aliases:
          - spicedb
    restart: unless-stopped

networks:
  coolify:
    external: true
    name: "${COOLIFY_NETWORK:-coolify}"
