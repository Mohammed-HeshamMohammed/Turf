# Every service on one machine (decision 1 of docs/plans/service-architecture.md). Only the gateway is published.
# Build from the repository folder "Caller Whale CRM":  docker compose --env-file env/compose.env -f deploy/compose.yml up --build
# The secrets come from env/compose.env (node tools/env-init.mjs creates it; env/README.md).
name: callerwhale
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env/compose.env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
  gateway:
    build:
      context: ../services/gateway
    environment:
      PORT: "8100"
      UPSTREAMS: "auth=http://auth:8101,notifications=http://notifications:8102,billing=http://billing:8103,importing-lists=http://importing-lists:8111,skip-tracing=http://skip-tracing:8112,dialer-sms=http://dialer-sms:8113,leads-map=http://leads-map:8114,crm=http://crm:8115,ai-campaigns=http://ai-campaigns:8116,exports=http://exports:8117,backup-restore=http://backup-restore:8118,messaging=http://messaging:8108"
    ports:
      - "8100:8100"
    restart: unless-stopped
  auth:
    build:
      context: ../services/auth
    environment:
      PORT: "8101"
      DATABASE_URL: "${AUTH_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_auth}"
      # Without it every token stops working on restart.
      AUTH_SIGNING_KEY: "${AUTH_SIGNING_KEY:?set AUTH_SIGNING_KEY in env/compose.env}"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_AUTH_TOKEN:?set AUTHZ_AUTH_TOKEN in env/compose.env}"
    restart: unless-stopped
  notifications:
    build:
      context: ../services/notifications
    environment:
      PORT: "8102"
    restart: unless-stopped
  billing:
    build:
      context: ../services/billing
    environment:
      PORT: "8103"
      DATABASE_URL: "${BILLING_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_billing}"
      BILLING_TOKENS: "${BILLING_TOKENS:-}"
      PADDLE_WEBHOOK_SECRET: "${PADDLE_WEBHOOK_SECRET:-}"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_BILLING_TOKEN:?set AUTHZ_BILLING_TOKEN in env/compose.env}"
    restart: unless-stopped
  authz:
    build:
      context: ../services/authz
    environment:
      PORT: "8104"
      DATABASE_URL: "${AUTHZ_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_authz?sslmode=disable}"
      AUTHZ_SIGNING_KEY: "${AUTHZ_SIGNING_KEY:?set AUTHZ_SIGNING_KEY in env/compose.env}"
      AUTHZ_TOKENS: "billing=${AUTHZ_BILLING_TOKEN:?set AUTHZ_BILLING_TOKEN in env/compose.env},auth=${AUTHZ_AUTH_TOKEN:?set AUTHZ_AUTH_TOKEN in env/compose.env},core-api=${AUTHZ_CORE_TOKEN:?set AUTHZ_CORE_TOKEN in env/compose.env}"
    depends_on:
      - postgres
    restart: unless-stopped
  crm-core:
    build:
      context: ../services/crm-core
    environment:
      PORT: "8107"
      DATABASE_URL: "${CRM_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_crm?sslmode=disable}"
      AUTH_JWKS_URL: "http://auth:8101/.well-known/jwks.json"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_CORE_TOKEN:?set AUTHZ_CORE_TOKEN in env/compose.env}"
      NOTIFY_URL: "http://notifications:8102"
      IMPORT_DIR: "/data/imports"
    volumes:
      - imports:/data/imports
    depends_on:
      - postgres
      - authz
    restart: unless-stopped
  messaging:
    build:
      context: ../services/messaging
    environment:
      PORT: "8108"
      DATABASE_URL: "${MESSAGING_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_messaging?sslmode=disable}"
      AUTH_JWKS_URL: "http://auth:8101/.well-known/jwks.json"
      AUTHZ_URL: "http://authz:8104"
      AUTHZ_TOKEN: "${AUTHZ_MESSAGING_TOKEN:?set AUTHZ_MESSAGING_TOKEN in env/compose.env (and messaging=... in authz's AUTHZ_TOKENS)}"
      LIVE_API_URL: "http://centrifugo:8000/api"
      LIVE_API_KEY: "${LIVE_API_KEY:?set LIVE_API_KEY in env/compose.env}"
      LIVE_TOKEN_SECRET: "${LIVE_TOKEN_SECRET:?set LIVE_TOKEN_SECRET in env/compose.env}"
      LIVE_PUBLIC_URL: "${LIVE_PUBLIC_URL:-ws://localhost:8000/connection/websocket}"
    depends_on:
      - postgres
      - authz
      - centrifugo
    restart: unless-stopped
  # The live server: holds the apps' sockets and delivers what the messaging service tells it. Only messaging calls its API.
  centrifugo:
    build:
      context: ../services/live
    environment:
      CENTRIFUGO_HTTP_API_KEY: "${LIVE_API_KEY:?set LIVE_API_KEY in env/compose.env}"
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: "${LIVE_TOKEN_SECRET:?set LIVE_TOKEN_SECRET in env/compose.env}"
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "${LIVE_ALLOWED_ORIGINS:-http://localhost:5190}"
    ports:
      - "8000:8000"
    restart: unless-stopped
  assistant:
    build:
      context: ../services/assistant
    environment:
      PORT: "8109"
      CORS_ORIGINS: "${SITE_ORIGIN:-http://localhost:5200}"
      # Empty runs the script only; set it in env/compose.env to try the AI.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    restart: unless-stopped
  importing-lists:
    build:
      context: ../services/features/importing-lists
    environment:
      PORT: "8111"
      # One machine for trying things out: the worker uses the database owner. Production gives it its own login (IMPORT_DB_ROLE on crm-core).
      DATABASE_URL: "${CRM_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/callerwhale_crm?sslmode=disable}"
      IMPORT_DIR: "/data/imports"
    volumes:
      - imports:/data/imports
    depends_on:
      - crm-core
    # No memory or CPU cap: a large list may use what the machine has.
    restart: unless-stopped
  skip-tracing:
    build:
      context: ../services/features/skip-tracing
    environment:
      PORT: "8112"
    restart: unless-stopped
  dialer-sms:
    build:
      context: ../services/features/dialer-sms
    environment:
      PORT: "8113"
    restart: unless-stopped
  leads-map:
    build:
      context: ..
      dockerfile: services/features/leads-map/Dockerfile
    environment:
      PORT: "8114"
    restart: unless-stopped
  crm:
    build:
      context: ..
      dockerfile: services/features/crm/Dockerfile
    environment:
      PORT: "8115"
    restart: unless-stopped
  ai-campaigns:
    build:
      context: ../services/features/ai-campaigns
    environment:
      PORT: "8116"
    restart: unless-stopped
  exports:
    build:
      context: ../services/features/exports
    environment:
      PORT: "8117"
    restart: unless-stopped
  backup-restore:
    build:
      context: ..
      dockerfile: services/features/backup-restore/Dockerfile
    environment:
      PORT: "8118"
    restart: unless-stopped
volumes:
  postgres-data:
  imports:
