      - uid: web-errors
        title: "The web app is erroring"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: "sum(count_over_time({container=~\".+\"} |= \"client_error\" [15m])) or vector(0)"
              queryType: instant
          - refId: B
            datasourceUid: __expr__
