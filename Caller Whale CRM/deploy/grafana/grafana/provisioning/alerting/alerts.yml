      - uid: slow-text
        title: "Sending texts or call outcomes is slow"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: "max(quantile_over_time(0.75, {container=~\".+\"} |= \"HTTP request\" | regexp `\\|\\s*\\[(?P<result>[A-Z]+)\\]\\s*\\|\\s*(?P<service>[^|]+?)\\s*\\|\\s*HTTP request\\s*\\|\\s*(?P<method>[A-Z]+)\\s*\\|\\s*(?P<status>\\d+)\\s*\\|\\s*(?P<seconds>[0-9.]+) s\\s*\\|\\s*(?P<path>\\S*)` | service=\"Dialer SMS\" | method=\"POST\" | path=~\"/api/v1/sms|/api/v1/calls/[^/]+/disposition\" | unwrap seconds [15m]))"
              queryType: instant
          - refId: B
            datasourceUid: __expr__
