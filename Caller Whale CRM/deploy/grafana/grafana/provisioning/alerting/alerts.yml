# Written by deploy/grafana/alerts.mjs (build step 42). Do not edit by hand: change that file and run it.
apiVersion: 1
contactPoints:
  - orgId: 1
    name: urgent-on-call
    receivers:
      - uid: urgent-on-call
        type: webhook
        settings:
          url: http://alert-relay:8121/alerts?level=urgent
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $RELAY_TOKEN
  - orgId: 1
    name: routine-everyone
    receivers:
      - uid: routine-everyone
        type: webhook
        settings:
          url: http://alert-relay:8121/alerts?level=routine
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $RELAY_TOKEN
muteTimes:
  - orgId: 1
    name: night
    time_intervals:
      - times:
          - start_time: "22:00"
            end_time: "24:00"
          - start_time: "00:00"
            end_time: "07:00"
        location: Europe/Paris
policies:
  - orgId: 1
    receiver: routine-everyone
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: urgent-on-call
        object_matchers: [["severity", "=", "urgent"]]
        group_wait: 10s
        repeat_interval: 30m
      - receiver: routine-everyone
        object_matchers: [["severity", "=", "routine"]]
        mute_time_intervals: [night]
groups:
  - orgId: 1
    name: urgent
    folder: Caller Whale alerts
    interval: 1m
    rules:
      - uid: core-down
        title: "A service calls, texts or sign-in need is down"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "min by (instance) (probe_success{job=\"services\", instance=~\".*//(gateway|auth|crm-core|dialer-sms):.*\"})"
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
        noDataState: OK
        execErrState: Error
        for: 2m
        labels: { severity: urgent }
        annotations: { summary: "{{ $$labels.instance }} is not answering" }
      - uid: public-down
        title: "The website or sign-in address is down"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "min by (instance) (probe_success{job=\"public\"})"
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
        noDataState: OK
        execErrState: Error
        for: 3m
        labels: { severity: urgent }
        annotations: { summary: "{{ $$labels.instance }} is not reachable from outside" }
      - uid: sign-in-failing
        title: "Sign-in is failing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: "sum(count_over_time({container=~\".+\"} |= \"HTTP request\" | regexp `\\|\\s*\\[(?P<result>[A-Z]+)\\]\\s*\\|\\s*(?P<service>[^|]+?)\\s*\\|\\s*HTTP request\\s*\\|\\s*(?P<method>[A-Z]+)\\s*\\|\\s*(?P<status>\\d+)\\s*\\|\\s*(?P<seconds>[0-9.]+) s\\s*\\|\\s*(?P<path>\\S*)` | service=\"Auth\" | path=~\"/v1/sessions.*|/v1/oauth.*|/v1/token.*\" | status=~\"5..\" [5m])) or vector(0)"
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [5] } }] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: urgent }
        annotations: { summary: "Sign-in answered with server errors more than 5 times in 5 minutes" }
      - uid: calls-failing
        title: "Calls are failing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: "sum(count_over_time({container=~\".+\"} |= \"HTTP request\" | regexp `\\|\\s*\\[(?P<result>[A-Z]+)\\]\\s*\\|\\s*(?P<service>[^|]+?)\\s*\\|\\s*HTTP request\\s*\\|\\s*(?P<method>[A-Z]+)\\s*\\|\\s*(?P<status>\\d+)\\s*\\|\\s*(?P<seconds>[0-9.]+) s\\s*\\|\\s*(?P<path>\\S*)` | service=\"Dialer SMS\" | path=~\"/api/v1/calls.*|/webhooks/telnyx\" | status=~\"5..\" [5m])) or vector(0)"
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [3] } }] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: urgent }
        annotations: { summary: "Calls answered with server errors more than 3 times in 5 minutes" }
      - uid: texts-failing
        title: "Texts are failing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: "sum(count_over_time({container=~\".+\"} |= \"HTTP request\" | regexp `\\|\\s*\\[(?P<result>[A-Z]+)\\]\\s*\\|\\s*(?P<service>[^|]+?)\\s*\\|\\s*HTTP request\\s*\\|\\s*(?P<method>[A-Z]+)\\s*\\|\\s*(?P<status>\\d+)\\s*\\|\\s*(?P<seconds>[0-9.]+) s\\s*\\|\\s*(?P<path>\\S*)` | service=\"Dialer SMS\" | path=~\"/api/v1/sms.*\" | status=~\"5..\" [5m])) or vector(0)"
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [3] } }] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: urgent }
        annotations: { summary: "Texts answered with server errors more than 3 times in 5 minutes" }
  - orgId: 1
    name: routine
    folder: Caller Whale alerts
    interval: 1m
    rules:
      - uid: service-down
        title: "A service is down"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "min by (instance) (probe_success{job=\"services\", instance=~\".*//(authz|billing|notifications|messaging|assistant|grafana-proxy|alert-relay):.*\"})"
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [1] } }] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels: { severity: routine }
        annotations: { summary: "{{ $$labels.instance }} is not answering" }
      - uid: chats-failing
        title: "Chats are failing"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: "sum(count_over_time({container=~\".+\"} |= \"HTTP request\" | regexp `\\|\\s*\\[(?P<result>[A-Z]+)\\]\\s*\\|\\s*(?P<service>[^|]+?)\\s*\\|\\s*HTTP request\\s*\\|\\s*(?P<method>[A-Z]+)\\s*\\|\\s*(?P<status>\\d+)\\s*\\|\\s*(?P<seconds>[0-9.]+) s\\s*\\|\\s*(?P<path>\\S*)` | service=\"Messaging\" | status=~\"5..\" [10m])) or vector(0)"
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [5] } }] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: routine }
        annotations: { summary: "Chats answered with server errors more than 5 times in 10 minutes" }
      - uid: server-errors
        title: "Many server errors"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: "sum(count_over_time({container=~\".+\"} |= \"HTTP request\" | regexp `\\|\\s*\\[(?P<result>[A-Z]+)\\]\\s*\\|\\s*(?P<service>[^|]+?)\\s*\\|\\s*HTTP request\\s*\\|\\s*(?P<method>[A-Z]+)\\s*\\|\\s*(?P<status>\\d+)\\s*\\|\\s*(?P<seconds>[0-9.]+) s\\s*\\|\\s*(?P<path>\\S*)` | status!=\"\" | status=~\"5..\" [10m])) or vector(0)"
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [50] } }] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels: { severity: routine }
        annotations: { summary: "More than 50 server errors across the services in 10 minutes" }
      - uid: disk-full
        title: "Disk almost full"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "max by (mountpoint) (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay\"})"
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0.85] } }] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: routine }
        annotations: { summary: "{{ $$labels.mountpoint }} is more than 85% full" }
      - uid: memory-full
        title: "Memory almost full"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes"
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [0.9] } }] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels: { severity: routine }
        annotations: { summary: "The server's memory is more than 90% used" }
      - uid: certificate
        title: "A certificate expires soon"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: "min by (instance) (probe_ssl_earliest_cert_expiry - time()) / 86400"
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: lt, params: [14] } }] }
        noDataState: OK
        execErrState: Error
        for: 1h
        labels: { severity: routine }
        annotations: { summary: "{{ $$labels.instance }}'s certificate expires in under 14 days" }
      - uid: slow-open
        title: "Opening leads or lists is slow"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: "max(quantile_over_time(0.75, {container=~\".+\"} |= \"HTTP request\" | regexp `\\|\\s*\\[(?P<result>[A-Z]+)\\]\\s*\\|\\s*(?P<service>[^|]+?)\\s*\\|\\s*HTTP request\\s*\\|\\s*(?P<method>[A-Z]+)\\s*\\|\\s*(?P<status>\\d+)\\s*\\|\\s*(?P<seconds>[0-9.]+) s\\s*\\|\\s*(?P<path>\\S*)` | service=\"CRM core\" | method=\"GET\" | path=~\"/api/v1/leads/[^/]+|/sync/snapshot.*|/api/v1/projects/.*\" | unwrap seconds [15m]))"
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [{ evaluator: { type: gt, params: [1] } }] }
        noDataState: OK
        execErrState: Error
        for: 15m
        labels: { severity: routine }
        annotations: { summary: "Opening a lead or a list takes more than a second for one person in four" }
      - uid: slow-save
        title: "Saving outcomes is slow"
        condition: C
        data:
          - refId: A
