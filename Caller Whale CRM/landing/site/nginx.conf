# security-headers.conf is written when the image is built (scripts/security-headers.mjs). nginx drops the headers of the
# server block in any location that sets an add_header of its own, so every location includes the file again.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  include /etc/nginx/security-headers.conf;
  location = /healthz {
    include /etc/nginx/security-headers.conf;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"ok":true,"service":"landing"}';
  }
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
