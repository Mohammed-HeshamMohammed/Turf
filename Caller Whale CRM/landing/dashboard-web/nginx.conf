# security-headers.conf is written when the image is built (scripts/security-headers.mjs). nginx drops the headers of the
# server block in any location that sets an add_header of its own, so every location includes the file again.
# The app is one HTML file; every address that is not a real file gets it.
map $request_uri $callerwhale_request_path { ~^([^?]*) $1; }
map $callerwhale_request_path $callerwhale_page {
  default "Page or file            ";
  / "CRM app                 ";
  ~^/assets/ "App asset               ";
}
map $status $callerwhale_result {
  default "[REVIEW]  ";
  ~^2 "[OK]      ";
  ~^3 "[REDIRECT]";
  ~^4 "[REJECTED]";
  ~^5 "[ERROR]   ";
}
map $request_method $callerwhale_method {
  default "OTHER  ";
  GET "GET    ";
  HEAD "HEAD   ";
  POST "POST   ";
  PUT "PUT    ";
  PATCH "PATCH  ";
  DELETE "DELETE ";
  OPTIONS "OPTIONS";
  CONNECT "CONNECT";
  TRACE "TRACE  ";
}
map $request_time $callerwhale_time {
  default "  >99999 s ";
  "~^(?<cw_time_1>[0-9]{1}[.][0-9]{3})$" "    $cw_time_1 s";
  "~^(?<cw_time_2>[0-9]{2}[.][0-9]{3})$" "   $cw_time_2 s";
  "~^(?<cw_time_3>[0-9]{3}[.][0-9]{3})$" "  $cw_time_3 s";
  "~^(?<cw_time_4>[0-9]{4}[.][0-9]{3})$" " $cw_time_4 s";
  "~^(?<cw_time_5>[0-9]{5}[.][0-9]{3})$" "$cw_time_5 s";
}
log_format callerwhale_dashboard escape=json '| $callerwhale_result | Dashboard | $callerwhale_page | $callerwhale_method | $status  | $callerwhale_time | $callerwhale_request_path';
server {
  listen 8080;
  access_log /dev/stdout callerwhale_dashboard;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  include /etc/nginx/security-headers.conf;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  location = /healthz {
    access_log off;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 200 '{"ok":true}';
  }
  # Built files carry a hash in their name, so they never change.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  # Hidden files (.env, .git) never exist here; answering them with the app page only invites more scanning.
  location ~ /\. {
    access_log off;
    include /etc/nginx/security-headers.conf;
    return 404;
  }
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
