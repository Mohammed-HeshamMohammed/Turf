map $request_uri $callerwhale_request_path { ~^([^?]*) $1; }
map $callerwhale_request_path $callerwhale_page {
  default "Page or file            ";
  / "Dashboard home          ";
  /features "Features page           ";
  /features/ "Features page           ";
  /pricing "Pricing page            ";
  /pricing/ "Pricing page            ";
  /compare "Why Caller Whale page   ";
  /compare/ "Why Caller Whale page   ";
  /security "Security page           ";
  /security/ "Security page           ";
  /contact "Contact page            ";
  /contact/ "Contact page            ";
  /privacy "Privacy page            ";
  /privacy/ "Privacy page            ";
  /terms "Terms page              ";
  /terms/ "Terms page              ";
  /signin "Sign in page            ";
  /signin/ "Sign in page            ";
  /signup "Create account page     ";
  /signup/ "Create account page     ";
  /dashboard "Dashboard page          ";
  /dashboard/ "Dashboard page          ";
  /verify "Email confirmation page ";
  /verify/ "Email confirmation page ";
  /robots.txt "Search crawler rules    ";
  /sitemap.xml "Sitemap                 ";
  /manifest.json "App manifest            ";
  /favicon.ico "Site icon               ";
  ~^/assets/ "Website asset           ";
}
map $status $callerwhale_result {
  default "[REVIEW]  ";
  ~^2 "[OK]      ";
  ~^3 "[REDIRECT]";
  ~^4 "[REJECTED]";
  ~^5 "[ERROR]   ";
}
map $request_method $callerwhale_method {
  default "OTHER  ";
  GET "GET    ";
  HEAD "HEAD   ";
  POST "POST   ";
  PUT "PUT    ";
  PATCH "PATCH  ";
  DELETE "DELETE ";
  OPTIONS "OPTIONS";
  CONNECT "CONNECT";
  TRACE "TRACE  ";
}
map $request_time $callerwhale_time {
  default "  >99999 s ";
  "~^(?<cw_time_1>[0-9]{1}[.][0-9]{3})$" "    $cw_time_1 s";
  "~^(?<cw_time_2>[0-9]{2}[.][0-9]{3})$" "   $cw_time_2 s";
  "~^(?<cw_time_3>[0-9]{3}[.][0-9]{3})$" "  $cw_time_3 s";
  "~^(?<cw_time_4>[0-9]{4}[.][0-9]{3})$" " $cw_time_4 s";
  "~^(?<cw_time_5>[0-9]{5}[.][0-9]{3})$" "$cw_time_5 s";
}
log_format callerwhale_dashboard escape=json '| $callerwhale_result | Dashboard | $callerwhale_page | $callerwhale_method | $status  | $callerwhale_time | $callerwhale_request_path';
server {
  listen 8080;
  access_log /dev/stdout callerwhale_dashboard;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location = /healthz { access_log off; default_type application/json; return 200 '{"ok":true}'; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
