# Keeps every container's dependencies and base images current. One monthly pull request per ecosystem and folder group (minor and
# patch updates together, each major update on its own), reviewed in the monthly update review (D307,
# Caller Whale CRM/docs/plans/security-upkeep.md). Security updates are opened straight away by GitHub whatever this schedule
# says, and serious ones are fixed within a week. The checks in .github/workflows/audit.yml tell which of them matter.
version: 2

updates:
  # --- JavaScript: the websites, the desktop app's web part, and the tools -------------------------------------------------
  - package-ecosystem: npm
    directories:
      - "/Caller Whale App"
      # The npm workspace (D383): the CRM app, the website and packages/ share the root lock file.
      - "/"
      - "/Caller Whale CRM/tools/firebase"
      - "/Caller Whale CRM/services/features/ai-campaigns"
    schedule: { interval: monthly, time: "06:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, npm]

  # --- Go: the gateway, auth, authorization, notifications and the Grafana login proxy -------------------------------------
  - package-ecosystem: gomod
    directories:
      - "/services/gateway"
      - "/services/auth"
      - "/services/authz"
      - "/services/notifications"
      - "/services/grafana-proxy"
      - "/services/dialer-sms"
      - "/services/crm-core"
      - "/services/messaging"
      - "/services/assistant"
      - "/services/learning"
      - "/services/mcp"
      - "/services/alert-relay"
    schedule: { interval: monthly, time: "06:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, go]

  # --- Python: billing, and the skip-tracing engine ------------------------------------------------------------------------
  - package-ecosystem: pip
    directories:
      - "/services/billing"
      - "/services/importing-lists"
      - "/service"
    schedule: { interval: monthly, time: "06:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, python]

  # --- Rust: the root workspace (the desktop window and its feature crates), the older desktop app and the scaffolds --------
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/Caller Whale App/src-tauri"
      - "/Caller Whale CRM"
    schedule: { interval: monthly, time: "06:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, rust]

  # --- Containers: the base image of every Dockerfile (node, golang, python, rust, nginx, distroless) ------------------------
  - package-ecosystem: docker
    directories:
      - "/services/gateway"
      - "/services/auth"
      - "/services/authz"
      - "/services/billing"
      - "/services/notifications"
      - "/services/grafana-proxy"
      - "/Caller Whale CRM/services/features/ai-campaigns"
      - "/Caller Whale CRM/services/features/backup-restore"
      - "/Caller Whale CRM/services/features/crm"
      - "/services/dialer-sms"
      - "/services/crm-core"
      - "/services/messaging"
      - "/services/assistant"
      - "/services/learning"
      - "/services/mcp"
      - "/services/alert-relay"
      - "/Caller Whale CRM/services/features/exports"
      - "/services/importing-lists"
      - "/Caller Whale CRM/services/features/leads-map"
      - "/Caller Whale CRM/services/features/skip-tracing"
    schedule: { interval: monthly, time: "06:00", timezone: "Etc/UTC" }
    open-pull-requests-limit: 5
    groups:
      base-images:
        patterns: ["*"]
    labels: [dependencies, docker]

  # --- The build checks themselves -----------------------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly, time: "06:00", timezone: "Etc/UTC" }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
