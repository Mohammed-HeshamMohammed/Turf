name: Check CRM and services

# Runs the CRM's own tests where there is a real PostgreSQL: crm-core's database tests (the leads, the sync, the lead details and who may see
# what), the auth service's, authz's and billing's, then the CRM app's and the website's tests and builds. The container builds (services/*/Dockerfile) run
# `go vet` and `go test` as well, without a database; this is where the database tests run.

on:
  push:
    branches: [main]
    paths:
      - "Caller Whale CRM/services/crm-core/**"
      - "Caller Whale CRM/services/auth/**"
      - "Caller Whale CRM/services/billing/**"
      - "Caller Whale CRM/services/authz/**"
      - "Caller Whale CRM/services/messaging/**"
      - "Caller Whale CRM/desktop/frontend/react/**"
      - "Caller Whale CRM/landing/site/**"
      - ".github/workflows/check-backend.yml"
  pull_request:
    paths:
      - "Caller Whale CRM/services/crm-core/**"
      - "Caller Whale CRM/services/auth/**"
      - "Caller Whale CRM/services/billing/**"
      - "Caller Whale CRM/services/authz/**"
      - "Caller Whale CRM/services/messaging/**"
      - "Caller Whale CRM/desktop/frontend/react/**"
      - "Caller Whale CRM/landing/site/**"
      - ".github/workflows/check-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crm-core:
    name: crm-core (Go, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: testpass
      # The tests reset the crm and importing schemas with the superuser and run the service as an ordinary login, so row security applies.
      CRM_TEST_ADMIN_URL: postgres://postgres:testpass@localhost:5432/crm_test?sslmode=disable
      CRM_TEST_DATABASE_URL: postgres://crm_app:apppass@localhost:5432/crm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "Caller Whale CRM/services/crm-core/go.mod"
          cache-dependency-path: "Caller Whale CRM/services/crm-core/go.sum"
      - name: Create the test login and database
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE crm_app LOGIN PASSWORD 'apppass' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE crm_test"
          psql -h localhost -U postgres -d crm_test -c "GRANT ALL ON DATABASE crm_test TO crm_app; GRANT ALL ON SCHEMA public TO crm_app"
      - run: go vet ./...
        working-directory: "Caller Whale CRM/services/crm-core"
      # -v shows each test's name, so a database test that was skipped (the variables above missing) is visible rather than a quiet pass.
      - run: go test ./... -count=1 -v | tee test.log
        working-directory: "Caller Whale CRM/services/crm-core"
      - name: The database tests really ran
        run: |
          grep -q -- '--- PASS: TestALeadsDetailsComeWhenItIsOpened' test.log
          grep -q -- '--- PASS: TestABigWorkspaceSendsAWindowAndSearchFindsTheRest' test.log
        working-directory: "Caller Whale CRM/services/crm-core"

  messaging:
    name: messaging (Go, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: testpass
      # The tests reset the messaging schema with the superuser and run the service as an ordinary login, so row security applies.
      MESSAGING_TEST_ADMIN_URL: postgres://postgres:testpass@localhost:5432/messaging_test?sslmode=disable
      MESSAGING_TEST_DATABASE_URL: postgres://messaging_ci:apppass@localhost:5432/messaging_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "Caller Whale CRM/services/messaging/go.mod"
          cache-dependency-path: "Caller Whale CRM/services/messaging/go.sum"
      - name: Create the test login and database
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE messaging_ci LOGIN PASSWORD 'apppass' NOSUPERUSER NOBYPASSRLS"
          psql -h localhost -U postgres -c "CREATE DATABASE messaging_test"
          psql -h localhost -U postgres -d messaging_test -c "GRANT ALL ON DATABASE messaging_test TO messaging_ci; GRANT ALL ON SCHEMA public TO messaging_ci"
      - run: go vet ./...
        working-directory: "Caller Whale CRM/services/messaging"
      - run: go test ./... -count=1 -v | tee test.log
        working-directory: "Caller Whale CRM/services/messaging"
      - name: The database tests really ran
        run: |
          grep -q -- '--- PASS: TestTwoPeopleChat' test.log
          grep -q -- '--- PASS: TestRowSecurityHidesOtherPeoplesMessages' test.log
        working-directory: "Caller Whale CRM/services/messaging"

  auth:
    name: auth (Go, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUTH_TEST_DATABASE_URL: postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "Caller Whale CRM/services/auth/go.mod"
          cache-dependency-path: "Caller Whale CRM/services/auth/go.sum"
      - run: go vet ./...
        working-directory: "Caller Whale CRM/services/auth"
      - run: go test ./... -count=1
        working-directory: "Caller Whale CRM/services/auth"

  authz:
    name: authz (Go, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUTHZ_TEST_DATABASE_URL: postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "Caller Whale CRM/services/authz/go.mod"
          cache-dependency-path: "Caller Whale CRM/services/authz/go.sum"
      - run: go vet ./...
        working-directory: "Caller Whale CRM/services/authz"
      - run: go test ./... -count=1 -v 2>&1 | tee test.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
        working-directory: "Caller Whale CRM/services/authz"
      - name: The database tests ran (not skipped)
        run: grep -q -- '--- PASS: TestPostgresTeamTree' test.log
        working-directory: "Caller Whale CRM/services/authz"

  billing:
    name: billing (Python, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
        working-directory: "Caller Whale CRM/services/billing"
      - run: python -m unittest discover -s tests -v 2>&1 | tee test.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
        working-directory: "Caller Whale CRM/services/billing"
      - name: The database tests ran (not skipped)
        run: grep -qE '^test_the_ready_made_plans_are_there_and_a_membership_keeps_only_the_limits_that_differ .* \.\.\. ok$' test.log
        working-directory: "Caller Whale CRM/services/billing"

  crm-app:
    name: CRM app (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "Caller Whale CRM/desktop/frontend/react/package-lock.json"
      - run: npm ci
        working-directory: "Caller Whale CRM/desktop/frontend/react"
      - run: npm run typecheck
        working-directory: "Caller Whale CRM/desktop/frontend/react"
      - run: npm test
        working-directory: "Caller Whale CRM/desktop/frontend/react"
      - run: npx vite build
        working-directory: "Caller Whale CRM/desktop/frontend/react"

  website:
    name: Website (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "Caller Whale CRM/landing/site/package-lock.json"
      - run: npm ci
        working-directory: "Caller Whale CRM/landing/site"
      - run: npm run typecheck
        working-directory: "Caller Whale CRM/landing/site"
      - run: npm test
        working-directory: "Caller Whale CRM/landing/site"
      - run: npm run build
        working-directory: "Caller Whale CRM/landing/site"
