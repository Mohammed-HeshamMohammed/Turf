name: CI

# The one check `main` requires (D376, D377). It always runs, on every pull request and every push to main, and decides inside which
# parts to test: a part runs when its files (or what it depends on) changed in the pull request, and every part runs on main, on a
# manual run, and when anything under .github/ changed. A part skipped because nothing of it changed counts as passed; the last job,
# "CI summary", fails when any part failed or was cancelled. Every deployed part has a job here (D378); a part with none is not deployed.
#
# Not here, on purpose: the daily dependency audit (audit.yml), the monthly currency check (currency-data.yml) and the desktop release
# (release-crm.yml), because they depend on the outside world or run on a schedule; and the desktop apps (desktop.yml for the CRM
# desktop app and the Skip Tracing engine, older-app.yml for the older desktop app in apps/lists-desktop), which have their own development and release: their
# checks show on a pull request that touches them but do not block merging to main (owner, 2026-11-19).

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: parts
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node "tools/ci-parts.mjs" >> "$GITHUB_OUTPUT"

  # Go and Python services, each through service-check.yml.
  crm-core:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'crm-core')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/crm-core
      language: go
      # The tests reset the schemas with the superuser and run the service as an ordinary login, so row security applies.
      setup: |
        psql -h localhost -U postgres -c "CREATE ROLE crm_app LOGIN PASSWORD 'apppass' NOSUPERUSER NOBYPASSRLS"
        psql -h localhost -U postgres -c "CREATE DATABASE crm_test"
        psql -h localhost -U postgres -d crm_test -c "GRANT ALL ON DATABASE crm_test TO crm_app; GRANT ALL ON SCHEMA public TO crm_app"
      env: |
        CRM_TEST_ADMIN_URL=postgres://postgres:testpass@localhost:5432/crm_test?sslmode=disable
        CRM_TEST_DATABASE_URL=postgres://crm_app:apppass@localhost:5432/crm_test?sslmode=disable
      must_pass: |
        --- PASS: TestALeadsDetailsComeWhenItIsOpened
        --- PASS: TestABigWorkspaceSendsAWindowAndSearchFindsTheRest
        --- PASS: TestTheDialerLogsCarrierCallsAsThePersonWhoMadeThem
        --- PASS: TestFilesOnALeadAreKeptAndOnlyForThoseWhoSeeIt
        --- PASS: TestLeadsAreGivenDownTheTeamTree
        --- PASS: TestRestoreOneAgencyFromACopy
        --- PASS: TestWorkWithoutAJobIsAdoptedOnce
        --- PASS: TestAJobContainerAnswersItsHealthAndQueues

  messaging:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'messaging')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/messaging
      language: go
      setup: |
        psql -h localhost -U postgres -c "CREATE ROLE messaging_ci LOGIN PASSWORD 'apppass' NOSUPERUSER NOBYPASSRLS"
        psql -h localhost -U postgres -c "CREATE DATABASE messaging_test"
        psql -h localhost -U postgres -d messaging_test -c "GRANT ALL ON DATABASE messaging_test TO messaging_ci; GRANT ALL ON SCHEMA public TO messaging_ci"
        # A real live server (the Centrifugo version services/live pins, with its config.json) reading the outbox of a database of its
        # own as the read-only login the service makes, so it never takes the other tests' queues.
        psql -h localhost -U postgres -c "CREATE DATABASE messaging_live_test"
        # Centrifugo stops at start when it cannot log in, so the login exists first (the service then keeps its password and grants).
        psql -h localhost -U postgres -c "CREATE ROLE messaging_live LOGIN PASSWORD 'test-live-login-password-0123456789'"
        image=$(sed -n 's#^FROM \(centrifugo/centrifugo:v[0-9.]*\).*#\1#p' ../live/Dockerfile)
        docker run -d --name live --network host -v "$PWD/../live/config.json:/centrifugo/config.json:ro" \
          -e CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY=test-live-e2e-token-secret-0123456789 \
          -e CENTRIFUGO_HTTP_API_KEY=test-live-e2e-api-key-0123456789abcdef \
          -e CENTRIFUGO_UNI_SSE_ENABLED=true \
          -e CENTRIFUGO_CONSUMERS_MESSAGING_ENABLED=true \
          -e CENTRIFUGO_CONSUMERS_MESSAGING_POSTGRESQL_DSN="postgres://messaging_live:test-live-login-password-0123456789@localhost:5432/messaging_live_test?sslmode=disable" \
          "$image" centrifugo --config=/centrifugo/config.json
        for i in $(seq 1 30); do curl -fs http://localhost:8000/health >/dev/null && break; sleep 1; done
        curl -fs http://localhost:8000/health >/dev/null || { docker logs live; exit 1; }
      env: |
        MESSAGING_TEST_ADMIN_URL=postgres://postgres:testpass@localhost:5432/messaging_test?sslmode=disable
        MESSAGING_TEST_DATABASE_URL=postgres://messaging_ci:apppass@localhost:5432/messaging_test?sslmode=disable
        LIVE_E2E_URL=http://localhost:8000
        LIVE_E2E_ADMIN_URL=postgres://postgres:testpass@localhost:5432/messaging_live_test?sslmode=disable
        LIVE_E2E_SECRET=test-live-e2e-token-secret-0123456789
      must_pass: |
        --- PASS: TestTwoPeopleChat
        --- PASS: TestRowSecurityHidesOtherPeoplesMessages
        --- PASS: TestUpdatesAreQueuedForTheLiveServerInOrder
        --- PASS: TestARealLiveServerDeliversTheOutbox

  telnyx:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'telnyx')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/telnyx
      language: go
      race: true
      # The tests remake the dialer_sms schema and play every call and text against the built-in Telnyx simulator.
      env: DIALER_TEST_DATABASE_URL=postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
      must_pass: |
        --- PASS: TestEveryCallScenarioLogsTheRightOutcomeOnceWhateverTheWebhookOrder
        --- PASS: TestTextsAreConversationsDeliveryMovesForwardAndStopIsObeyed

  auth:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'auth')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/auth
      language: go
      env: AUTH_TEST_DATABASE_URL=postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
      must_pass: |
        --- PASS: TestSignInOpensASession
        --- PASS: TestTheDatabaseIsBroughtUpToDateOnceAndSafelyTogether

  authz:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'authz')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/authz
      language: go
      env: AUTHZ_TEST_DATABASE_URL=postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
      must_pass: "--- PASS: TestPostgresTeamTree"

  learning:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'learning')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/learning
      language: go
      setup: |
        psql -h localhost -U postgres -c "CREATE ROLE learning_ci LOGIN PASSWORD 'apppass' NOSUPERUSER NOBYPASSRLS"
        psql -h localhost -U postgres -c "CREATE DATABASE learning_test OWNER learning_ci"
      env: LEARNING_TEST_URL=postgres://learning_ci:apppass@localhost:5432/learning_test?sslmode=disable
      must_pass: "--- PASS: TestTheStoreHoldsHashesAndShapesAndHonoursErasure"

  notifications:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'notifications')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/notifications
      language: go
      # The mail queue tests remake the notifications schema.
      env: NOTIFY_TEST_DATABASE_URL=postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
      must_pass: |
        --- PASS: TestAnEmailTheMailServerCannotTakeYetIsKeptAndSentOnceLater
        --- PASS: TestTwoSendersNeverSendTheSameEmail

  mcp:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'mcp')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/mcp
      language: go

  assistant:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'assistant')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/assistant
      language: go

  # The shared Go modules (packages/go, step 50+51); every service that imports them also runs when they change.
  authverify:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'go-packages')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: packages/go/authverify
      language: go

  runtimelog:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'go-packages')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: packages/go/runtimelog
      language: go

  gateway:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'gateway')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/gateway
      language: go

  grafana-proxy:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'grafana')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/grafana-proxy
      language: go

  alert-relay:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'grafana')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/alert-relay
      language: go

  billing:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'billing')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/billing
      language: python
      env: TEST_DATABASE_URL=postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
      must_pass: "^test_the_ready_made_plans_are_there_and_a_membership_keeps_only_the_limits_that_differ .* \\.\\.\\. ok$"

  importing-lists:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'importing-lists')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/importing-lists
      language: python
      # The queue test builds crm-core's tables from its numbered scripts.
      env: CRM_TEST_ADMIN_URL=postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
      must_pass: "^test_.* \\(test_queue\\.QueueTest.* \\.\\.\\. ok$"

  # The importing worker, its own container since split 1: it fetches each upload from importing-lists.
  importing-worker:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'importing-worker')
    uses: ./.github/workflows/service-check.yml
    with:
      dir: services/importing-worker
      language: python
      # The end-to-end test builds crm-core's tables from its numbered scripts.
      env: CRM_TEST_ADMIN_URL=postgres://postgres:testpass@localhost:5432/postgres?sslmode=disable
      must_pass: "^test_.* \\(test_worker\\.EndToEndTest.* \\.\\.\\. ok$"

  # The live server's settings, the generator and branch scripts, the alert rules, the configuration notes, and every copy of a
  # shared file matching its source.
  tools:
    name: Tools, shared copies, live server settings, alert rules, configuration notes
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'tools')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test "tools/*.test.mjs" "deploy/monitoring/*.test.mjs" "services/live/*.test.mjs" "packages/*/test/*.test.mjs"
      - run: node "tools/env-notes.mjs" check
      # Every call between services has a timeout (one stuck service must not hang the ones that call it).
      - run: node "tools/check-timeouts.mjs"
      - name: Every image starts through the log wrapper; the scaffold copies match their source
        run: |
          # The deployed images build the wrapper from packages/go/runtimelog. The scaffolds (until step 54) get generated copies,
          # which are not kept on main: write them, check, and make sure nothing that is kept changed.
          node "tools/runtime-log/sync.mjs"
          node "tools/runtime-log/sync.mjs" --check
          git diff --exit-code
      - name: The alert rules file is up to date
        run: |
          node "deploy/monitoring/alerts.mjs"
          git diff --exit-code -- "deploy/monitoring/"

  crm-app:
    name: CRM app (types, lint, build, tests)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'crm-app')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # The Skip Tracing tests run the real engine (service/, Python), as the desktop app does.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engines/skip-engine/requirements.txt
      - run: pip install -r ../../engines/skip-engine/requirements.txt
      # npm workspaces (D383): one install at the repository root for the apps and packages/.
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm run lint
      # The full build (with the Sites packaging step) comes first: one test checks the files it makes.
      - run: npm run build
      - run: npm test

  website:
    name: Website (types, tests, build)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.parts), 'website')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  summary:
    # The check `main` requires. Passing means every part that had to run passed.
    name: CI summary
    if: always()
    needs: [changes, authverify, runtimelog, crm-core, messaging, telnyx, auth, authz, learning, notifications, mcp, assistant, gateway, grafana-proxy, alert-relay, billing, importing-lists, importing-worker, tools, crm-app, website]
    runs-on: ubuntu-latest
    steps:
      - name: Every part that ran passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled")] | length')
          [ "$bad" = 0 ] || { echo "::error::$bad part(s) failed or were cancelled"; exit 1; }
          [ "$(echo "$RESULTS" | jq -r '.changes.result')" = success ] || { echo "::error::Could not tell what changed"; exit 1; }
