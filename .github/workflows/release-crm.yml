name: Release the desktop app

# Builds the Full CRM desktop app (Full CRM Turf/desktop) into a Windows installer and publishes it as a GitHub
# release. Caller Whale's server offers the newest release whose tag starts with "crm-v" to invited people only, on their
# dashboard (CALLERWHALE_RELEASE_REPO, CALLERWHALE_RELEASE_TAG_PREFIX).
#
# Start it by pushing a tag:   git tag crm-v0.2.0 && git push origin crm-v0.2.0
# or from the Actions tab (Run workflow), giving the version.
#
# The app's server and sign-in settings are the repository's Actions variables (Settings -> Secrets and variables ->
# Actions -> Variables). They end up inside the app, so none of them is a server secret:
#   CALLERWHALE_API_URL                     Caller Whale's server, e.g. https://app.callerwhale.com
#   FIREBASE_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_APP_ID, FIREBASE_AUTH_DOMAIN
#   GOOGLE_DESKTOP_CLIENT_ID, GOOGLE_DESKTOP_CLIENT_SECRET   the "Desktop app" OAuth client (Google sign-in)

on:
  push:
    tags: ["crm-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (tagged crm-v<version>)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-crm
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      VITE_CALLERWHALE_API_URL: ${{ vars.CALLERWHALE_API_URL || vars.TURF_API_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROVIDERS: google
      VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
      VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ vars.GOOGLE_DESKTOP_CLIENT_SECRET }}
      # The product never opens the sample workspace: every start asks for sign-in.
      VITE_CALLERWHALE_REQUIRE_SIGN_IN: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Version and tag
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then version="$REQUESTED_VERSION"; else version="${GITHUB_REF_NAME#crm-v}"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.2.3, got '$version'"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=crm-v$version" >> "$GITHUB_OUTPUT"
          echo "{\"version\": \"$version\"}" > "Full CRM Turf/desktop/container/rust/version.json"

      - name: Update signing is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Set TAURI_SIGNING_PRIVATE_KEY before publishing updates"; exit 1; }

      - name: The app's settings are set
        shell: bash
        run: |
          # A value pasted into GitHub can carry a line break or spaces; they would end up inside the app (Google
          # then refuses the client id). Every setting is used trimmed.
          for name in VITE_CALLERWHALE_API_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_FIREBASE_AUTH_DOMAIN VITE_GOOGLE_DESKTOP_CLIENT_ID VITE_GOOGLE_DESKTOP_CLIENT_SECRET; do
            value=$(printf '%s' "${!name}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            printf -v "$name" '%s' "$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          missing=""
          for name in VITE_CALLERWHALE_API_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            [ -n "${!name}" ] || missing="$missing ${name#VITE_}"
          done
          if [ -n "$missing" ]; then echo "::error::Set these repository Actions variables first:$missing"; exit 1; fi
          [ -n "$VITE_GOOGLE_DESKTOP_CLIENT_ID" ] || echo "::warning::GOOGLE_DESKTOP_CLIENT_ID is not set: the app offers email sign-in only"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Full CRM Turf/desktop/frontend/react/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Full CRM Turf/desktop/container/rust

      # The Skip Tracing engine, as one executable inside the installer, so the app needs no Python.
      - run: pip install -r service/requirements.txt pyinstaller
      - run: python service/tools/build_service.py

      - run: npm ci
        working-directory: Full CRM Turf/desktop/frontend/react
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: node scripts/tauri.mjs build --config tauri.package.conf.json --config version.json
        working-directory: Full CRM Turf/desktop/frontend/react
      # After the build: one test checks the built files (dist/client).
      - run: npm test
        working-directory: Full CRM Turf/desktop/frontend/react
      - run: cargo test --locked --manifest-path "Full CRM Turf/desktop/container/rust/Cargo.toml"

      - name: Generate the signed update feed
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-manifest.mjs
        working-directory: Full CRM Turf/desktop/frontend/react

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=$(ls "Full CRM Turf/desktop/container/rust/target/release/bundle/nsis/"*.exe | head -n 1)
          [ -n "$installer" ] || { echo "::error::No installer was built"; exit 1; }
          signature="$installer.sig"
          manifest="$(dirname "$installer")/latest.json"
          [ -s "$signature" ] && [ -s "$manifest" ] || { echo "::error::Missing signed updater artifacts"; exit 1; }
          tag="${{ steps.version.outputs.tag }}"
          notes="Caller Whale ${{ steps.version.outputs.version }} for Windows. Includes in-app checks for signed updates, download progress, and Install and restart. If you use 0.1.3 or earlier, install this version once to enable future updates. Sign in with the account your invitation was sent to."
          if gh release view "$tag" > /dev/null 2>&1; then
            [ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" = true ] || { echo "::error::This version is already published. Release a new version instead of replacing signed files."; exit 1; }
          else
            gh release create "$tag" --draft --title "Caller Whale ${{ steps.version.outputs.version }}" --notes "$notes" --target "${{ github.sha }}"
          fi
          gh release upload "$tag" "$installer" "$signature" "$manifest" --clobber
          # The feed only becomes visible when all three assets are uploaded. Every stable release advances it.
          gh release edit "$tag" --draft=false --latest
