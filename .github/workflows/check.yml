name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The same checks as `npm run check`, on the system Caller Whale is built for.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Caller Whale App/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Caller Whale App/src-tauri
      - run: npm ci
        working-directory: Caller Whale App
      - run: pip install -r service/requirements.txt pytest
      - run: npm run lint
        working-directory: Caller Whale App
      - run: npm run format:check
        working-directory: Caller Whale App
      - run: npm run build
        working-directory: Caller Whale App
      - run: npm test
        working-directory: Caller Whale App
      - run: python -m pytest service/tests -q
      - run: cargo test --manifest-path "Caller Whale App/src-tauri/Cargo.toml"
