name: Check container configuration notes
on:
  push:
    branches: [main]
    paths:
      - "Caller Whale CRM/env/**"
      - "Caller Whale CRM/deploy/grafana/compose.yml"
      - "Caller Whale CRM/deploy/grafana/.env.example"
      - "Caller Whale CRM/tools/env-notes.mjs"
      - ".github/workflows/check-env-notes.yml"
  pull_request:
    paths:
      - "Caller Whale CRM/env/**"
      - "Caller Whale CRM/deploy/grafana/compose.yml"
      - "Caller Whale CRM/deploy/grafana/.env.example"
      - "Caller Whale CRM/tools/env-notes.mjs"
      - ".github/workflows/check-env-notes.yml"
permissions:
  contents: read
jobs:
  configuration-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node "Caller Whale CRM/tools/env-notes.mjs" check
