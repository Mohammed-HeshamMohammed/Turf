name: Desktop app

# The CRM desktop app (apps/crm, apps/crm-desktop, crates/) and the Skip Tracing engine it ships (engines/skip-engine), on Windows. Kept apart from ci.yml on
# purpose: the desktop app has its own development and release (release-crm.yml), so a desktop failure shows on the pull request but
# does not block merging to main. It runs only when the desktop's files change. Build and test it green before tagging a release.

on:
  pull_request:
    paths:
      - "apps/crm/**"
      - "apps/crm-desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scaffolds/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "engines/skip-engine/**"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "apps/crm/**"
      - "apps/crm-desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scaffolds/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "engines/skip-engine/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  skip-engine:
    name: Skip Tracing engine (Python, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engines/skip-engine/requirements.txt
      - run: pip install -r engines/skip-engine/requirements.txt pytest
      - run: python -m pytest engines/skip-engine/tests -q

  desktop-app:
    name: Desktop app (feature modules and window, Windows)
    runs-on: windows-latest
    env:
      CALLERWHALE_SERVICE_ROOT: ${{ github.workspace }}\service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engines/skip-engine/requirements.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            Caller Whale CRM
      - run: pip install -r engines/skip-engine/requirements.txt
      # The window embeds the built frontend, so it is built first.
      # npm workspaces (D383): install once at the root, then build the frontend.
      - run: npm ci
      - run: npm run build
        working-directory: apps/crm
      # The desktop app's window and feature crates (the root workspace, step 52), then the scaffold crates' own workspace.
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked
        working-directory: scaffolds


  summary:
    # What the publish script asks for before it refreshes desktop-app-production and skip-engine-production (tools/production.json).
    name: Desktop summary
    if: always()
    needs: [skip-engine, desktop-app]
    runs-on: ubuntu-latest
    steps:
      - name: Both passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          [ "$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success")] | length')" = 0 ] || { echo "::error::The desktop checks did not all pass"; exit 1; }
