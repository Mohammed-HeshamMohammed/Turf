openapi: 3.0.3
info:
  title: Caller Whale authentication service
  version: 0.1.0
  description: The one source of truth for who someone is. Other services verify its access tokens with the public keys at /.well-known/jwks.json and never call it to do so.
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT (EdDSA) }
  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [bad_request, unauthenticated, wrong_credentials, mfa_required, wrong_code, human_required, forbidden, conflict, too_many_attempts, internal] }
    Tokens:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        refresh_token: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            email: { type: string }
            name: { type: string }
paths:
  /healthz:
    get: { summary: Is the service running, responses: { "200": { description: Running } } }
  /version:
    get: { summary: The running version, responses: { "200": { description: Version } } }
  /.well-known/jwks.json:
    get:
      summary: The public keys every service checks access tokens with
      responses: { "200": { description: A JSON Web Key Set of Ed25519 keys } }
  /v1/accounts:
    post:
      summary: Create an account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, terms_version]
              properties: { terms_version: { type: string, description: The version of the terms and privacy notice they accepted (GET /v1/me tells the current one) }, birth_date: { type: string, description: "Date of birth, YYYY-MM-DD. Refused (403) under 18" }, email: { type: string }, password: { type: string, minLength: 8, maxLength: 4096, description: Requires uppercase and lowercase ASCII letters plus a number and a special character }, name: { type: string }, kind: { type: string, enum: [browser, desktop] }, human_token: { type: string, maxLength: 2048, description: Required when bot protection is enabled } }
      responses:
        "201": { description: Created and signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "400": { description: Not valid, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Sign-up is closed, human verification is required, or the person is under 18 }
        "409": { description: The email already has an account }
  /v1/sessions:
    post:
      summary: Sign in
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string }, code: { type: string, description: Authenticator or recovery code }, kind: { type: string, enum: [browser, desktop] }, human_token: { type: string, maxLength: 2048, description: Required when bot protection is enabled } }
      responses:
        "200": { description: Signed in, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { description: wrong_credentials, mfa_required or wrong_code }
        "429": { description: too_many_attempts }
    get:
      summary: This person's open sessions
      security: [{ bearer: [] }]
      responses: { "200": { description: The sessions }, "401": { description: Not signed in } }
  /v1/sessions/refresh:
    post:
      summary: Swap a refresh token for a new pair. A refresh token works once
      requestBody: { content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses: { "200": { description: New tokens }, "401": { description: Not valid, used already, or the session ended } }
  /v1/sessions/sign-out:
    post:
      summary: End the session of the bearer token, or of the refresh token in the body
      responses: { "200": { description: Ended } }
  /v1/sessions/revoke:
    post:
      summary: Close one session, or every other session
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { session_id: { type: string }, others: { type: boolean } } } } } }
      responses: { "200": { description: Closed } }
  /v1/me:
    get:
      summary: Who the token belongs to
      security: [{ bearer: [] }]
      responses: { "200": { description: The person }, "401": { description: Not signed in } }
  /v1/me/access:
    get:
      summary: Current person's platform role and workspace memberships from authorization
      security: [{ bearer: [] }]
      responses: { "200": { description: Current access }, "401": { description: Not signed in }, "503": { description: Authorization unavailable } }
  /v1/me/profile:
    post:
      summary: Change the signed-in person's display name, saved phone and small PNG or JPEG picture
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [name, phone, avatar], properties: { name: { type: string }, phone: { type: string }, avatar: { type: string }, first_name: { type: string, nullable: true }, middle_name: { type: string, nullable: true }, last_name: { type: string, nullable: true } } } } } }
      responses: { "200": { description: Profile saved }, "401": { description: Not signed in }, "400": { description: Invalid profile detail } }
  /v1/me/birth-date:
    post:
      summary: Give the date of birth for the age check, once (accounts made before the check, or through Google or Apple)
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [birth_date], properties: { birth_date: { type: string, description: YYYY-MM-DD } } } } } }
      responses: { "200": { description: Age confirmed }, "400": { description: Not a real date, or already given }, "401": { description: Not signed in }, "403": { description: Under 18 } }
  /v1/me/terms:
    post:
      summary: Accept the current terms and privacy notice
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: string } } } } } }
      responses: { "200": { description: Accepted }, "400": { description: Not the current version }, "401": { description: Not signed in } }
  /v1/me/work:
    post:
      summary: Say what the person's work is (role, team size, what they will use Caller Whale for), so it can be set up to fit them
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [role, team_size, uses], properties: { role: { type: string, enum: [business_owner, lead_buyer, call_center, sales_team, solo_caller, data_provider, other] }, team_size: { type: string, enum: [just_me, "2_10", "11_50", 51_plus] }, uses: { type: array, items: { type: string, enum: [cold_calling, buying_selling_leads, managing_deals, follow_ups, skip_tracing, team_reporting, sms_email] } }, other: { type: string, maxLength: 200 } } } } } }
      responses: { "200": { description: Saved }, "400": { description: An answer is not one of the choices }, "401": { description: Not signed in } }
  /v1/me/providers:
    get:
      summary: Google and Apple methods linked to the signed-in Firebase account
      security: [{ bearer: [] }]
      responses: { "200": { description: Linked providers }, "401": { description: Not signed in } }
  /v1/me/providers/{provider}/start:
    post:
      summary: Start linking Google or Apple to the current account after a recent sign-in
      security: [{ bearer: [] }]
      responses: { "200": { description: Provider redirect URL }, "403": { description: Sign in again first } }
  /v1/admin/staff:
    get:
      summary: Platform staff directory for owner, cofounder, and system admin after a second step
      security: [{ bearer: [] }]
      responses: { "200": { description: Staff directory }, "403": { description: Staff role or second step required }, "503": { description: Authorization unavailable } }
    post:
      summary: Assign or remove a system admin or tester role by account email; owner and cofounder only
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { type: string, enum: [system_admin, tester, ""] } } } } } }
      responses: { "200": { description: Role saved }, "403": { description: Owner or cofounder with second step required }, "404": { description: Account has not signed in }, "503": { description: Authorization unavailable } }
  /v1/admin/invitations:
    get:
      summary: List live platform staff invitations; staff with a second step
      security: [{ bearer: [] }]
      responses: { "200": { description: Pending invitations }, "403": { description: Staff access required } }
    post:
      summary: Invite a system admin or tester by verified email; owner or cofounder only
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { type: string, enum: [system_admin, tester] } } } } } }
      responses: { "201": { description: Invitation saved, with delivery_state sent, failed, or not_configured }, "403": { description: Founder with second step required }, "409": { description: Duplicate invitation or existing staff role } }
  /v1/me/currency:
    post:
      summary: Set the signed-in person's main currency (an ISO code), or clear it with an empty value to go back to automatic
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { currency: { type: string } } } } } }
      responses: { "200": { description: Saved }, "400": { description: Not a currency we know } }
  /v1/fx:
    get:
      summary: Exchange rates against the US dollar (ISO currencies only, kept six hours, last good rates if the source is down). Public; for showing prices in a visitor's currency and for the owner's own sums, never for what a customer is charged
      responses: { "200": { description: "base, as_of and rates" }, "503": { description: No rates available yet } }
  /v1/roles:
    get:
      summary: Every role there is, with nothing twice: the standard workspace roles, and the platform staff roles in their own group
      security: [{ bearer: [] }]
      responses: { "200": { description: Role catalog }, "401": { description: Sign in first } }
  /v1/admin/members:
    get:
      summary: Accounts that are not platform staff, newest first, with workspaces, roles, two-step and last activity; staff with a second step
      security: [{ bearer: [] }]
      responses: { "200": { description: Members }, "403": { description: Staff access required }, "503": { description: Authorization unavailable } }
  /v1/admin/overview:
    get:
      summary: People, plans, usage and (owner and cofounder only) revenue, costs, profit and return; staff with a second step
      security: [{ bearer: [] }]
      responses: { "200": { description: Overview; the finance block is present only for owner and cofounder }, "403": { description: Staff access required } }
  /v1/announcement:
    get:
      summary: The announcement banner shown on the public site (enabled, message, optional link, tone). Public
      responses: { "200": { description: The announcement; enabled is false when none is showing } }
  /v1/admin/announcement:
    put:
      summary: Set the announcement banner; platform staff (owner, cofounder, system admin) after a second step
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [enabled, message, tone], properties: { enabled: { type: boolean }, message: { type: string, maxLength: 200 }, link_label: { type: string, maxLength: 30 }, link_url: { type: string, description: "A path starting with / or an https:// address" }, tone: { type: string, enum: [info, promo, warning] }, tab_enabled: { type: boolean }, tab_text: { type: string, maxLength: 30 }, tab_url: { type: string } } } } } }
      responses: { "200": { description: Saved }, "400": { description: Not valid }, "403": { description: Staff access with a second step required } }
  /v1/admin/costs:
    get:
      summary: Running costs the owner has entered; owner and cofounder only
      security: [{ bearer: [] }]
      responses: { "200": { description: Costs }, "403": { description: Owner or cofounder with second step required } }
    post:
      summary: Add a running cost (hosting, tools, marketing, staff pay, other; monthly, yearly or once); owner and cofounder only
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [label, category, amount_minor, currency, interval], properties: { label: { type: string }, category: { type: string, enum: [hosting, tools, marketing, staff_pay, other] }, amount_minor: { type: integer }, currency: { type: string }, interval: { type: string, enum: [monthly, yearly, once] }, note: { type: string } } } } } }
      responses: { "201": { description: Cost saved }, "400": { description: Not valid }, "403": { description: Owner or cofounder with second step required } }
  /v1/admin/costs/{id}:
    delete:
      summary: Remove a running cost; owner and cofounder only
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Removed }, "403": { description: Owner or cofounder with second step required } }
  /v1/admin/plans:
    get:
      summary: The plans that can be given to a person, from billing; owner and cofounder only
      security: [{ bearer: [] }]
      responses: { "200": { description: Plans }, "403": { description: Owner or cofounder with second step required }, "503": { description: Billing not connected } }
  /v1/admin/memberships:
    post:
      summary: Give a person a membership: opens their own workspace with the agency owner (or solo) role and gives it a plan as a trial, free, or paid manually. Asking again sets the plan again on the same workspace; owner and cofounder only
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [user_id, plan, payment], properties: { user_id: { type: string, format: uuid }, plan: { type: string }, payment: { type: string, enum: [trial, free, manual] }, role: { type: string, enum: [owner, solo] }, days: { type: integer }, months: { type: integer }, amount_minor: { type: integer }, limits: { type: object, description: 'The workspace limits where they differ from the plan (seats, clients, active_leads, imports_monthly, monthly_minutes, skiptrace_credits); null is unlimited', additionalProperties: { type: integer, nullable: true } } } } } } }
      responses: { "200": { description: Membership given }, "400": { description: Not valid }, "403": { description: Owner or cofounder with second step required }, "404": { description: No such account }, "409": { description: The workspace pays through the payment provider already }, "503": { description: Billing or authorization unavailable } }
  /v1/admin/rates:
    get:
      summary: Costs that follow customers (price per call minute, per gigabyte, payment provider fee); owner and cofounder only
      security: [{ bearer: [] }]
      responses: { "200": { description: Rates }, "403": { description: Owner or cofounder with second step required } }
    post:
      summary: Add a rate. Prices are in millionths of the currency unit; the payment fee is a percentage in hundredths of a percent plus a fixed part per payment; one rate per kind and currency
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [label, kind, currency], properties: { label: { type: string }, kind: { type: string, enum: [minute, gb, payment_fee] }, rate_micros: { type: integer }, quantity: { type: integer }, percent_bp: { type: integer }, fixed_micros: { type: integer }, currency: { type: string }, note: { type: string } } } } } }
      responses: { "201": { description: Rate saved }, "400": { description: Not valid, or a rate of that kind already exists }, "403": { description: Owner or cofounder with second step required } }
  /v1/admin/rates/{id}:
    delete:
      summary: Remove a rate; owner and cofounder only
      security: [{ bearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Removed }, "403": { description: Owner or cofounder with second step required } }
  /v1/orgs/{org}/standing:
    get:
      summary: A workspace's plan and usage (plan, status, period end, seats, minutes used against the minutes included); any member of that workspace
      security: [{ bearer: [] }]
      parameters: [{ name: org, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { "200": { description: Plan and usage }, "403": { description: Not your workspace }, "503": { description: Billing not available } }
  /v1/orgs/{org}/members:
    get:
      summary: List workspace members; agency owner with a second step only
      security: [{ bearer: [] }]
      responses: { "200": { description: Members and roles }, "403": { description: Owner with second step required } }
  /v1/orgs/{org}/roles:
    get:
      summary: List editable role keys for a workspace owner
      security: [{ bearer: [] }]
      responses: { "200": { description: Editable role keys }, "403": { description: Owner with second step required } }
  /v1/orgs/{org}/members/{user}:
    put:
      summary: Change existing member roles without changing their scopes; agency owner only
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, minItems: 1, maxItems: 8, items: { type: string } } } } } } }
      responses: { "200": { description: Role saved }, "403": { description: Owner or second step required }, "404": { description: Member absent } }
  /v1/orgs/{org}/invitations:
    get:
      summary: List pending invitations in a workspace; agency owner only
      security: [{ bearer: [] }]
      responses: { "200": { description: Pending invitations } }
    post:
      summary: Invite a person to an editable workspace role; agency owner only
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { type: string } } } } } }
      responses: { "201": { description: Invitation saved with delivery state }, "409": { description: Duplicate or existing member } }
  /v1/invitations/{id}:
    delete:
      summary: Withdraw a pending invitation; founder or workspace owner as appropriate
      security: [{ bearer: [] }]
      responses: { "200": { description: Withdrawn }, "404": { description: No pending invitation } }
  /v1/me/invitations:
    get:
      summary: List live invitations addressed to the signed-in verified email
      security: [{ bearer: [] }]
      responses: { "200": { description: Invitations, empty until email is verified } }
  /v1/me/invitations/{id}/accept:
    post:
      summary: Accept a pending invitation after verified-email sign-in; Authz checks the inviter's current authority
      security: [{ bearer: [] }]
      responses: { "200": { description: Membership applied }, "403": { description: Wrong email, expired invitation, or inviter lost authority }, "409": { description: Already has a role or membership } }
  /v1/password:
    post:
      summary: Change the password and close every other session
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [current, new], properties: { current: { type: string }, new: { type: string, minLength: 8, maxLength: 4096, description: Requires uppercase and lowercase ASCII letters plus a number and a special character } } } } } }
      responses: { "200": { description: Changed }, "401": { description: The current password is wrong } }
  /v1/mfa/setup:
    post:
      summary: Start two-step sign-in; returns the secret and an otpauth link
      security: [{ bearer: [] }]
      responses: { "200": { description: Started }, "409": { description: Already on } }
  /v1/mfa/confirm:
    post:
      summary: Turn two-step sign-in on with the first code; returns ten recovery codes, once
      security: [{ bearer: [] }]
      requestBody: { content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } } }
      responses: { "200": { description: On }, "401": { description: The code is not right } }

  /v1/security:
    get:
      summary: Public password policy and optional bot protection configuration
      responses:
        "200":
          description: Only the public site key is exposed; no secret key
          content:
            application/json:
              schema:
                type: object
                properties:
                  bot_protection:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      site_key: { type: string }
                  password_policy: { type: object, description: Minimum 8 and maximum 4096 characters with uppercase lowercase number and special requirements }
  /v1/providers:
    get:
      summary: Availability of Google and Apple using direct settings or cached Firebase authorization probes
      responses: { "200": { description: Object with google and apple boolean flags } }
  /v1/oauth/{provider}/start:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [google, apple] } }
    post:
      summary: Verify optional human proof and prepare a provider authorization URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: { type: string, enum: [website, landing, app, desktop] }
                port: { type: integer, minimum: 1024, maximum: 65535, description: Required for desktop loopback handoff }
                human_token: { type: string, maxLength: 2048, description: Required when bot protection is enabled }
                action: { type: string, enum: [signin, signup], default: signin }
      responses:
        "200": { description: JSON object with authorization url }
        "400": { description: Provider code-flow configuration is incomplete or the target is invalid }
        "403": { description: Human verification is required }
    get:
      summary: Legacy browser redirect available only when bot protection is disabled
      responses: { "303": { description: Provider authorization redirect }, "403": { description: Use the protected POST flow } }
